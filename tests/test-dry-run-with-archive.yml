name: Test dry_run with pre-made archive
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a zip archive containing appspec.yml
      - name: Create archive with appspec.yml
        run: |
          mkdir -p /tmp/archive-src
          cat > /tmp/archive-src/appspec.yml <<'EOF'
          version: 0.0
          os: linux
          files:
            - source: /
              destination: /var/www/app
          EOF
          echo "hello world" > /tmp/archive-src/index.html
          cd /tmp/archive-src
          zip -r /tmp/deployment.zip .
          echo "Archive created:"
          ls -la /tmp/deployment.zip

      - id: action
        uses: .
        continue-on-error: true
        with:
          s3_bucket: test-bucket
          s3_folder: test-folder
          codedeploy_name: test-app
          codedeploy_group: test-group
          archive: /tmp/deployment.zip
          dry_run: 'true'

      - name: Assert action ran (fails at AWS credential check without real creds)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # Without real AWS credentials, the action is expected to fail
          # at the aws sts get-caller-identity step. This is acceptable behavior.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action executed (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS"
