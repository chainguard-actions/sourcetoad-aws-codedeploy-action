name: Test dry-run with directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a subdirectory with appspec.yml for the action to zip
      - name: Create deployment directory with appspec.yml
        run: |
          mkdir -p "$GITHUB_WORKSPACE/deploy-dir"
          cat > "$GITHUB_WORKSPACE/deploy-dir/appspec.yml" <<'EOF'
          version: 0.0
          os: linux
          files:
            - source: /
              destination: /var/www/app
          EOF
          echo "hello world" > "$GITHUB_WORKSPACE/deploy-dir/index.html"

      - id: action
        uses: .
        with:
          s3_bucket: my-test-bucket
          s3_folder: my-test-folder
          codedeploy_name: my-app
          codedeploy_group: my-group
          directory: deploy-dir
          dry_run: 'true'

      - name: Assert zip_filename output is set
        env:
          ACTUAL: ${{ steps.action.outputs.zip_filename }}
        run: |
          echo "actual zip_filename: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected zip_filename to be non-empty"
            exit 1
          fi
          if [[ "$ACTUAL" != *.zip ]]; then
            echo "FAIL: expected zip_filename to end with .zip, got: $ACTUAL"
            exit 1
          fi
          echo "PASS: zip_filename=$ACTUAL"
