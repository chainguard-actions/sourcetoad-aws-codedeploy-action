name: Test required input validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action fails when required inputs are provided but AWS creds are missing
      # The action validates inputs before making AWS calls (when dry_run is false)
      # With dry_run=false and no AWS credentials, the action should fail
      - id: action
        uses: .
        continue-on-error: true
        with:
          s3_bucket: test-bucket
          s3_folder: test-folder
          codedeploy_name: test-app
          codedeploy_group: test-group
          dry_run: 'false'

      - name: Assert action fails without AWS credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # Without real AWS credentials, the action should fail
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without AWS credentials, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed without AWS credentials"
