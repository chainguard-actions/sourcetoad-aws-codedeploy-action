name: Test dry run with pre-built archive
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a pre-built zip archive from committed fixture files
        run: |
          cd "$GITHUB_WORKSPACE/tests/fixtures/archive-source"
          zip -r "$GITHUB_WORKSPACE/tests/fixtures/my-deployment.zip" .
          echo "Archive created:"
          ls -lh "$GITHUB_WORKSPACE/tests/fixtures/my-deployment.zip"

      - id: action
        uses: .
        with:
          s3_bucket: my-test-bucket
          s3_folder: releases
          archive: tests/fixtures/my-deployment.zip
          codedeploy_name: my-app
          codedeploy_group: production
          dry_run: 'true'

      - name: Assert zip_filename matches provided archive
        env:
          ACTUAL: ${{ steps.action.outputs.zip_filename }}
        run: |
          echo "actual zip_filename: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: zip_filename output was empty"
            exit 1
          fi
          if [ "$ACTUAL" != "tests/fixtures/my-deployment.zip" ]; then
            echo "FAIL: expected zip_filename to be 'tests/fixtures/my-deployment.zip', got: $ACTUAL"
            exit 1
          fi
          echo "PASS: zip_filename=$ACTUAL"

      - name: Assert etag is not set (dry run skips S3 upload)
        env:
          ACTUAL: ${{ steps.action.outputs.etag }}
        run: |
          echo "actual etag: $ACTUAL"
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: etag should be empty in dry_run mode, got: $ACTUAL"
            exit 1
          fi
          echo "PASS: etag is empty as expected in dry_run mode"
