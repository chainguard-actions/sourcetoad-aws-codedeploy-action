name: Test dry-run with pre-existing archive input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a pre-built zip archive with appspec.yml
        run: |
          mkdir -p /tmp/deploy-pkg
          cat > /tmp/deploy-pkg/appspec.yml << 'EOF'
          version: 0.0
          os: linux
          files:
            - source: /
              destination: /var/www/app
          EOF
          echo "app content" > /tmp/deploy-pkg/app.txt
          cd /tmp/deploy-pkg
          zip -r "$GITHUB_WORKSPACE/my-deployment.zip" .
          echo "Created zip:"
          ls -la "$GITHUB_WORKSPACE/my-deployment.zip"

      - id: action
        uses: .
        with:
          s3_bucket: 'test-bucket'
          s3_folder: 'test-folder'
          codedeploy_name: 'test-app'
          codedeploy_group: 'test-group'
          archive: 'my-deployment.zip'
          dry_run: 'true'

      - name: Assert zip_filename matches provided archive name
        env:
          ACTUAL: ${{ steps.action.outputs.zip_filename }}
        run: |
          echo "actual zip_filename: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected zip_filename to be non-empty"
            exit 1
          fi
          if [ "$ACTUAL" != "my-deployment.zip" ]; then
            echo "FAIL: expected zip_filename to be 'my-deployment.zip', got: $ACTUAL"
            exit 1
          fi
          echo "PASS: zip_filename correctly set to provided archive name: $ACTUAL"
