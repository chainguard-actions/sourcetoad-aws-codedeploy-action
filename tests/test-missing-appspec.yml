name: Test failure when appspec.yml is missing from directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create directory without appspec.yml in workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/no-appspec"
          echo "some content" > "$GITHUB_WORKSPACE/no-appspec/index.html"
          echo "Directory created without appspec.yml"
          ls -la "$GITHUB_WORKSPACE/no-appspec/"

      - id: action
        uses: .
        continue-on-error: true
        with:
          aws_access_key: fake-access-key
          aws_secret_key: fake-secret-key
          aws_region: us-east-1
          s3_bucket: my-test-bucket
          s3_folder: my-test-folder
          directory: no-appspec
          codedeploy_name: my-app
          codedeploy_group: my-group
          dry_run: 'true'

      - name: Assert action failed due to missing appspec.yml
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because appspec.yml is missing from the
          # specified directory. The deploy script checks for appspec.yml
          # before proceeding with the deployment.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to missing appspec.yml, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed due to missing appspec.yml"
