name: Test failure when appspec.yml is missing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      # Intentionally do NOT create appspec.yml — the action should fail
      - id: action
        uses: .
        with:
          s3_bucket: 'test-bucket'
          s3_folder: 'test-folder'
          codedeploy_name: 'test-app'
          codedeploy_group: 'test-group'
          dry_run: 'true'
        continue-on-error: true

      - name: Assert action failed due to missing appspec.yml
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when appspec.yml is missing, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when appspec.yml was missing"
